services:
  postgres:
    image: postgres:16-alpine
    container_name: zee9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zee9
      POSTGRES_PASSWORD: zee9pass
      POSTGRES_DB: zee9
    ports:
      - "5432:5432"
    volumes:
      - zee9_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zee9 -d zee9"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zee9-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - zee9_redisdata:/data

volumes:
  zee9_pgdata:
  zee9_redisdata:
